name: Draco Code CI
on:
  push:
    branches: [main, codex/draco-code-hardening-2026-11-04]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend and frontend smoke tests
        working-directory: backend
        run: npm run test:all
      - name: Package source archive
        if: always()
        run: |
          zip -qr DRACO_CODE_SOURCE.zip . -x '.git/*' '*/node_modules/*' '*/.vercel/*' '*/dist/*' '*/.env' '*/.env.local' '*/.env.production'
      - name: Upload complete source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draco-code-source
          path: DRACO_CODE_SOURCE.zip
          if-no-files-found: error
